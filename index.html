<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cup And Go</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f7f5f1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 24px;
      background: #171717;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .logo h1 {
      margin-top: 15px;
      font-size: 28px;
    }

    .logo p {
      margin-top: 7px;
      color: #777;
      font-size: 14px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 17px;
      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #171717;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .language {
      margin-top: 25px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .languages {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .languages button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">

      <div class="logo-icon">
        ☕
      </div>

      <h1>Cup And Go</h1>

      <p>
        Loyalty & Rewards
      </p>

    </div>

    <h2>
      Welcome Back
    </h2>

    <p class="subtitle">
      Sign in to continue
    </p>

    <label>
      Mobile Number
    </label>

    <input
      type="tel"
      placeholder="+966 5XXXXXXXX"
    >

    <label>
      Password
    </label>

    <input
      type="password"
      placeholder="Enter your password"
    >

    <button class="login-btn">
      Sign In
    </button>

    <div class="language">

      Language

      <div class="languages">

        <button>
          English
        </button>

        <button>
          العربية
        </button>

        <button>
          বাংলা
        </button>

      </div>

    </div>

  </div>

</body>

</html>
