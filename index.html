<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cup And Go — Premium POS</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root{
    --orange:#ff7a00;
    --orange2:#ffb347;
    --cream:#fff8f1;
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#171717;
    --muted:#777;
    --green:#08a878;
    --red:#ef5350;
    --blue:#536dfe;
    --border:#ececec;
    --shadow:0 12px 35px rgba(0,0,0,.07);
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:90px;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= SPLASH ================= */

#splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.2),transparent 30%),
        linear-gradient(135deg,#ff7100,#ffae42);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation:splashOut .7s ease 1.7s forwards;
}

.splash-logo{
    width:105px;
    height:105px;
    border-radius:32px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.2);
    animation:logoPulse 1.2s infinite alternate;
}

.splash-title{
    margin-top:20px;
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;
}

.splash-sub{
    margin-top:7px;
    opacity:.85;
    font-size:13px;
}

@keyframes logoPulse{
    to{transform:scale(1.08) rotate(2deg)}
}

@keyframes splashOut{
    to{opacity:0;visibility:hidden;pointer-events:none}
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:#111;
    color:#fff;
    z-index:500;
    padding:25px 15px;
    display:flex;
    flex-direction:column;
    box-shadow:10px 0 35px rgba(0,0,0,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 10px 30px;
}

.brand-logo{
    width:46px;
    height:46px;
    border-radius:15px;
    background:linear-gradient(135deg,#ff7200,#ffb13b);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
    box-shadow:0 8px 25px rgba(255,122,0,.3);
}

.brand h2{
    font-size:18px;
}

.brand span{
    display:block;
    font-size:10px;
    color:#999;
    margin-top:2px;
    letter-spacing:1px;
}

.nav-title{
    font-size:10px;
    color:#777;
    text-transform:uppercase;
    padding:10px;
    letter-spacing:1.5px;
}

.side-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#999;
    padding:13px 14px;
    border-radius:15px;
    text-align:left;
    display:flex;
    align-items:center;
    gap:12px;
    margin:3px 0;
    transition:.25s;
}

.side-btn:hover{
    background:#1e1e1e;
    color:#fff;
    transform:translateX(3px);
}

.side-btn.active{
    background:linear-gradient(135deg,#ff7600,#ff9f2f);
    color:#fff;
    box-shadow:0 8px 20px rgba(255,122,0,.2);
}

.side-icon{
    width:22px;
    text-align:center;
    font-size:18px;
}

.sidebar-bottom{
    margin-top:auto;
    padding:12px;
    border-top:1px solid #292929;
    color:#777;
    font-size:11px;
}

/* ================= MAIN ================= */

.main{
    margin-left:245px;
    min-height:100vh;
}

.topbar{
    height:76px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:100;
}

.page-heading h1{
    font-size:23px;
}

.page-heading p{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#fff;
    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
}

.avatar{
    width:42px;
    height:42px;
    border-radius:14px;
    background:linear-gradient(135deg,#222,#555);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:800;
}

/* ================= CONTENT ================= */

.content{
    padding:28px;
    max-width:1500px;
    margin:auto;
}

.page{
    animation:pageIn .4s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:none}
}

/* ================= STAT CARDS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:21px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    transition:.3s;
}

.stat:hover{
    transform:translateY(-4px);
}

.stat:after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    right:-40px;
    top:-40px;
    background:rgba(255,122,0,.07);
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat-icon{
    width:43px;
    height:43px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.orange{background:#fff0df;color:var(--orange)}
.green{background:#e5faf3;color:var(--green)}
.blue{background:#edf0ff;color:var(--blue)}
.red{background:#ffeded;color:var(--red)}

.stat-number{
    font-size:26px;
    font-weight:900;
    margin-top:16px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.stat-change{
    font-size:11px;
    color:var(--green);
    margin-top:8px;
    font-weight:700;
}

/* ================= CARDS ================= */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.card-head h3{
    font-size:16px;
}

.card-head span{
    color:var(--muted);
    font-size:11px;
}

/* ================= DASHBOARD GRID ================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:20px;
}

.chart-box{
    height:300px;
}

/* ================= QUICK ACTION ================= */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.quick{
    padding:18px 10px;
    border:1px solid var(--border);
    border-radius:18px;
    background:#fff;
    text-align:center;
    transition:.25s;
}

.quick:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
}

.quick-icon{
    font-size:25px;
    margin-bottom:9px;
}

.quick strong{
    font-size:12px;
}

/* ================= BUTTONS ================= */

.primary-btn,
.secondary-btn,
.danger-btn{
    border:0;
    border-radius:13px;
    padding:12px 17px;
    font-weight:800;
    transition:.2s;
}

.primary-btn{
    background:linear-gradient(135deg,#ff7200,#ff9f30);
    color:white;
    box-shadow:0 8px 20px rgba(255,122,0,.2);
}

.secondary-btn{
    background:#f2f3f5;
    color:#222;
}

.danger-btn{
    background:#fff0f0;
    color:#e53935;
}

.primary-btn:hover,
.secondary-btn:hover,
.danger-btn:hover{
    transform:translateY(-2px);
}

/* ================= POS ================= */

.pos-layout{
    display:grid;
    grid-template-columns:1.6fr .9fr;
    gap:20px;
}

.category-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:12px;
}

.category{
    border:1px solid var(--border);
    background:#fff;
    border-radius:30px;
    padding:9px 16px;
    white-space:nowrap;
    font-size:12px;
    font-weight:700;
}

.category.active{
    background:#111;
    color:#fff;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product{
    border:1px solid var(--border);
    border-radius:20px;
    padding:11px;
    background:#fff;
    transition:.3s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.product:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(0,0,0,.1);
}

.product-image{
    height:125px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    background:
        radial-gradient(circle at 50% 35%,#fff,transparent 35%),
        linear-gradient(135deg,#f8eee4,#e8d0b8);
}

.product:nth-child(2n) .product-image{
    background:linear-gradient(135deg,#f1eadb,#d7c5a5);
}

.product:nth-child(3n) .product-image{
    background:linear-gradient(135deg,#e8f0df,#c6d8b4);
}

.product-info{
    padding:12px 3px 4px;
}

.product-name{
    font-size:13px;
    font-weight:800;
}

.product-meta{
    display:flex;
    justify-content:space-between;
    margin-top:7px;
}

.product-price{
    font-weight:900;
    color:var(--orange);
}

.product-cat{
    font-size:10px;
    color:#999;
}

/* ================= CART ================= */

.cart{
    position:sticky;
    top:95px;
}

.cart-list{
    max-height:340px;
    overflow:auto;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #f0f0f0;
}

.cart-left{
    display:flex;
    gap:10px;
    align-items:center;
}

.cart-emoji{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#f8f1e9;
    display:flex;
    align-items:center;
    justify-content:center;
}

.cart-name{
    font-size:12px;
    font-weight:800;
}

.cart-qty{
    font-size:10px;
    color:#999;
    margin-top:3px;
}

.cart-right{
    text-align:right;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:5px;
}

.qty button{
    border:0;
    width:23px;
    height:23px;
    border-radius:7px;
    background:#f0f0f0;
}

.cart-total{
    margin-top:20px;
    padding-top:18px;
    border-top:2px dashed #ddd;
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin:9px 0;
    font-size:13px;
}

.total-final{
    font-size:21px;
    font-weight:900;
}

.payment-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.payment{
    padding:13px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#fff;
    font-weight:800;
}

.payment.active{
    border:2px solid var(--orange);
    background:#fff7ed;
}

/* ================= TABLE ================= */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    color:#999;
    padding:13px 10px;
    border-bottom:1px solid var(--border);
}

td{
    padding:15px 10px;
    font-size:12px;
    border-bottom:1px solid #f2f2f2;
}

.status{
    display:inline-flex;
    padding:6px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.status.completed{
    color:#078d68;
    background:#e4faf3;
}

.status.pending{
    color:#d98200;
    background:#fff4df;
}

.status.cancelled{
    color:#d43c3c;
    background:#ffeded;
}

/* ================= SEARCH ================= */

.search{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:13px;
    outline:none;
    background:#fff;
}

.search:focus{
    border-color:var(--orange);
}

/* ================= PRODUCTS ADMIN ================= */

.admin-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.admin-product{
    border:1px solid var(--border);
    border-radius:20px;
    padding:17px;
    background:#fff;
}

.admin-product-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.admin-product-emoji{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f7eee5;
    font-size:27px;
}

.admin-actions{
    display:flex;
    gap:6px;
    margin-top:14px;
}

.admin-actions button{
    flex:1;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(7px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    animation:modalBg .2s ease;
}

.modal-box{
    width:100%;
    max-width:470px;
    background:#fff;
    border-radius:28px;
    padding:25px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    animation:modalIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalBg{
    from{opacity:0}
    to{opacity:1}
}

@keyframes modalIn{
    from{opacity:0;transform:scale(.92) translateY(15px)}
    to{opacity:1;transform:none}
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    border:0;
    width:35px;
    height:35px;
    border-radius:10px;
    background:#f1f1f1;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    font-size:11px;
    font-weight:800;
    margin-bottom:6px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
}

.input:focus{
    border-color:var(--orange);
}

/* ================= TOAST ================= */

#toast{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translate(-50%,120px);
    background:#111;
    color:white;
    padding:13px 20px;
    border-radius:30px;
    font-size:12px;
    font-weight:800;
    z-index:5000;
    opacity:0;
    transition:.35s;
}

#toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* ================= MOBILE ================= */

.mobile-nav{
    display:none;
}

@media(max-width:1050px){
    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-grid,
    .pos-layout{
        grid-template-columns:1fr;
    }

    .cart{
        position:relative;
        top:auto;
    }

    .admin-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:750px){

    body{
        padding-bottom:78px;
    }

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
    }

    .topbar{
        height:68px;
        padding:0 15px;
    }

    .page-heading h1{
        font-size:18px;
    }

    .page-heading p{
        display:none;
    }

    .content{
        padding:16px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:16px;
        border-radius:19px;
    }

    .stat-number{
        font-size:21px;
    }

    .dashboard-grid{
        display:block;
    }

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-image{
        height:105px;
    }

    .admin-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:17px;
        border-radius:20px;
    }

    .mobile-nav{
        display:flex;
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:72px;
        background:rgba(255,255,255,.96);
        backdrop-filter:blur(20px);
        border-top:1px solid var(--border);
        z-index:800;
        justify-content:space-around;
        align-items:center;
    }

    .mobile-nav button{
        border:0;
        background:none;
        color:#888;
        font-size:9px;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:4px;
    }

    .mobile-nav button span{
        font-size:21px;
    }

    .mobile-nav button.active{
        color:var(--orange);
        font-weight:900;
    }

    .mobile-sale{
        width:53px!important;
        height:53px!important;
        border-radius:50%!important;
        background:linear-gradient(135deg,#ff7200,#ffad3c)!important;
        color:#fff!important;
        margin-top:-25px;
        box-shadow:0 10px 25px rgba(255,122,0,.35);
    }
}

@media(max-width:430px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .product-grid{
        gap:10px;
    }

    .product{
        padding:8px;
    }

    .product-image{
        height:95px;
        font-size:40px;
    }
}
</style>
</head>

<body>

<!-- ================= SPLASH ================= -->

<div id="splash">
    <div class="splash-logo">☕</div>
    <div class="splash-title">Cup And Go</div>
    <div class="splash-sub">PREMIUM BUSINESS HUB</div>
</div>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="brand">
        <div class="brand-logo">☕</div>
        <div>
            <h2>Cup And Go</h2>
            <span>BUSINESS HUB</span>
        </div>
    </div>

    <div class="nav-title">Management</div>

    <button class="side-btn active" onclick="showPage('dashboard',this)">
        <span class="side-icon">⌂</span> Dashboard
    </button>

    <button class="side-btn" onclick="showPage('sales',this)">
        <span class="side-icon">🛒</span> Sales
    </button>

    <button class="side-btn" onclick="showPage('orders',this)">
        <span class="side-icon">📦</span> Orders
    </button>

    <button class="side-btn" onclick="showPage('products',this)">
        <span class="side-icon">☕</span> Products
    </button>

    <button class="side-btn" onclick="showPage('menu',this)">
        <span class="side-icon">▦</span> Menu
    </button>

    <button class="side-btn" onclick="showPage('transactions',this)">
        <span class="side-icon">💳</span> Transactions
    </button>

    <button class="side-btn" onclick="showPage('customers',this)">
        <span class="side-icon">👥</span> Customers
    </button>

    <div class="nav-title">Business</div>

    <button class="side-btn" onclick="showPage('reports',this)">
        <span class="side-icon">📈</span> Reports
    </button>

    <button class="side-btn" onclick="showPage('settings',this)">
        <span class="side-icon">⚙️</span> Settings
    </button>

    <div class="sidebar-bottom">
        <div>☁ Firebase Connected</div>
        <div style="margin-top:5px">Cup And Go • SAR</div>
    </div>

</aside>

<!-- ================= MAIN ================= -->

<main class="main">

<header class="topbar">

    <div class="page-heading">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Welcome to your Cup And Go business hub</p>
    </div>

    <div class="top-actions">

        <button class="icon-btn" onclick="toggleTheme()">🌙</button>

        <button class="icon-btn" onclick="showToast('No new notifications')">
            🔔
        </button>

        <div class="avatar">CG</div>

    </div>

</header>

<div class="content">

<!-- ================= DASHBOARD ================= -->

<section id="page-dashboard" class="page">

    <div class="stats">

        <div class="stat">
            <div class="stat-top">
                <div>
