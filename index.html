<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cup And Go</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f7f5f1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 24px;
      background: #171717;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .logo h1 {
      margin-top: 15px;
      font-size: 28px;
    }

    .logo p {
      margin-top: 7px;
      color: #777;
      font-size: 14px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 17px;
      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #171717;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .language {
      margin-top: 25px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .languages {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .languages button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">

      <div class="logo-icon">
        ☕
      </div>

      <h1>Cup And Go</h1>

      <p>
        Loyalty & Rewards
      </p>

    </div>

    <h2>
      Welcome Back
    </h2>

    <p class="subtitle">
      Sign in to continue
    </p>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your admin email"
      autocomplete="email"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="login-btn"
      type="button"
    >
      Sign In
    </button>

    <div id="message" class="message"></div>

    <div class="language">

      Language

      <div class="languages">

        <button type="button">
          English
        </button>

        <button type="button">
          العربية
        </button>

        <button type="button">
          বাংলা
        </button>

      </div>

    </div>

  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0ZT0MVnyGvru0gRKcF1UkRR-jBCDSFys",
      authDomain: "cup-and-go-rewards.firebaseapp.com",
      projectId: "cup-and-go-rewards",
      storageBucket: "cup-and-go-rewards.firebasestorage.app",
      messagingSenderId: "400656059060",
      appId: "1:400656059060:web:43f5153aae2f4e1a88a5e1",
      measurementId: "G-NKDSWRB21B"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      message.textContent = "";

      if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        console.log(
          "Admin logged in:",
          userCredential.user.email
        );

        message.textContent = "Login successful!";

        // Next step: Admin Dashboard

      } catch (error) {

        console.error("Firebase Login Error:", error);

        if (
          error.code === "auth/invalid-credential"
        ) {
          message.textContent =
            "Invalid email or password.";
        } else if (
          error.code === "auth/user-not-found"
        ) {
          message.textContent =
            "Admin account not found.";
        } else if (
          error.code === "auth/wrong-password"
        ) {
          message.textContent =
            "Incorrect password.";
        } else {
          message.textContent =
            "Login failed. Please try again.";
        }

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";

      }

    });

    console.log("Cup And Go Firebase connected");

  </script>

</body>
</html>
